# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
        informational: false
    patch:
      default:
        target: 90%
        threshold: 1%
        informational: false

  # Exclude certain paths from coverage
  ignore:
    - "kernel/**"  # no_std kernel requires nightly
    - "**/benches/**"
    - "**/tests/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
