[package]
name = "tardis-vortex"
description = "Tardis LLM Inference Engine - Candle-based model serving"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Internal
tardis-common = { path = "../common" }

# ML Framework
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }

# Tokenization
tokenizers = { workspace = true }

# Model formats
safetensors = { workspace = true }
half = { workspace = true }

# HuggingFace Hub for model downloads
hf-hub = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Platform specific auto-activation
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
candle-transformers = { workspace = true, features = ["metal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
criterion = { workspace = true }

[[bench]]
name = "inference_benchmarks"
harness = false

[features]
default = []
# Enable CUDA GPU support (Requires local NVIDIA setup, disabled for CI safety)
cuda = []
# Enable Metal GPU support (macOS) - Auto-enabled on macOS via target deps
metal = []
