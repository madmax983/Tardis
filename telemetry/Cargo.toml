[package]
name = "tardis-telemetry"
description = "Tardis OS Telemetry - Full-stack observability with temporal query support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]

# Standard library support (userspace)
std = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tokio",
    "dep:parking_lot",
    "dep:once_cell",
    "dep:tardis-gallifrey",
    "dep:tardis-common",
    "dep:chrono",
    "serde/std",
    "serde_json/std",
]

# OpenTelemetry export support
otlp = [
    "std",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

# Kernel support (no_std)
kernel = ["dep:spin"]

[dependencies]
# Spinlocks for no_std (used by kernel logger)
spin = { workspace = true, optional = true }

# Core (always available, no_std compatible)
# tardis-common moved to optional for no_std support
tardis-common = { path = "../common", optional = true }

# Userspace dependencies (behind "std" feature)
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
parking_lot = { version = "0.12", optional = true }
once_cell = { version = "1.21", optional = true }
tardis-gallifrey = { path = "../gallifrey", optional = true }

# Time handling
# chrono default features include std, so disable them
chrono = { workspace = true, optional = true, default-features = false, features = ["serde"] }

# Serialization
# serde default features include std, so disable them
serde = { workspace = true, default-features = false, features = ["derive"] }
# serde_json default features include std, so disable them. Enable alloc for no_std usage (if any).
serde_json = { workspace = true, default-features = false, features = ["alloc"] }

# Error handling
thiserror = { workspace = true }

# OpenTelemetry (behind "otlp" feature)
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"], optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Disable default features to avoid 'nightly' feature which breaks stable builds
# Explicit version to allow overriding default-features
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "telemetry_benchmarks"
harness = false
