[package]
name = "tardis-telemetry"
description = "Tardis OS Telemetry - Full-stack observability with temporal query support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["std"]

# Standard library support (userspace)
std = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tokio",
    "dep:parking_lot",
    "dep:once_cell",
    "dep:tardis-gallifrey",
]

# OpenTelemetry export support
otlp = [
    "std",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

# Kernel support (no_std)
kernel = ["dep:x86_64"]

[dependencies]
# Core (always available, no_std compatible)
tardis-common = { path = "../common" }

# Kernel dependencies
x86_64 = { workspace = true, optional = true }

# Userspace dependencies (behind "std" feature)
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
parking_lot = { version = "0.12", optional = true }
once_cell = { version = "1.19", optional = true }
tardis-gallifrey = { path = "../gallifrey", optional = true }

# Time handling
chrono = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# OpenTelemetry (behind "otlp" feature)
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "telemetry_benchmarks"
harness = false
