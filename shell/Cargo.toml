[package]
name = "tardis-shell"
description = "Tardis AI Shell - Natural language interface with time-travel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "tardis"
path = "src/main.rs"

[features]
nova = ["dep:ratatui", "dep:crossterm", "tardis-gallifrey/nova", "tardis-chronos/nova"]

[dependencies]
# Internal
tardis-common = { path = "../common" }
tardis-vortex = { path = "../vortex" }
tardis-gallifrey = { path = "../gallifrey" }
tardis-chronos = { path = "../chronos" }
tardis-telemetry = { path = "../telemetry", features = ["std"] }

# TUI (Nova)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time handling
chrono = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# CLI
rustyline = "17"

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3.25.0"

[[bench]]
name = "router_benchmarks"
harness = false
